<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #f5f7fb;
    --ink: #16202e;
    --ink-2: #5a6578;
    --ink-3: #8a94a6;
    --line: #e3e8f0;
    --accent: #2447d6;
    --accent-ink: #ffffff;
    --accent-soft: #e6ebfc;
    --high: #d93a4a;
    --med: #e08a12;
    --low: #1f9d6b;
    --danger: #d93a4a;
    --shadow: 0 1px 2px rgba(22,32,46,.04), 0 12px 32px -12px rgba(22,32,46,.14);
    --radius: 16px;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #0e131c;
    --surface: #161d29;
    --surface-2: #1c2433;
    --ink: #eaeff7;
    --ink-2: #a3aec2;
    --ink-3: #6f7b91;
    --line: #263043;
    --accent: #6c8cff;
    --accent-ink: #0e131c;
    --accent-soft: #212c4d;
    --high: #ff6b78;
    --med: #f2a63b;
    --low: #3dc68f;
    --danger: #ff6b78;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 56px 20px 80px; }

  /* Header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .date-day { margin: 0; font-size: clamp(32px, 6vw, 44px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .date-full { margin: 6px 0 0; color: var(--ink-2); font-weight: 500; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); display: grid; place-items: center; color: var(--ink-2);
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  .progress { margin: 28px 0 24px; }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 14px; color: var(--ink-2); font-weight: 500; }
  .progress-row strong { color: var(--ink); font-weight: 700; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--accent); transition: width .45s cubic-bezier(.2,.8,.2,1); }

  /* Composer */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .composer { padding: 14px; display: grid; gap: 10px; }
  .composer-main { display: flex; gap: 10px; }
  .composer input[type="text"] {
    flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface-2); outline: none;
    transition: border-color .15s, background .15s;
  }
  .composer input[type="text"]::placeholder { color: var(--ink-3); }
  .composer input[type="text"]:focus { border-color: var(--accent); background: var(--surface); }
  .btn-primary {
    height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font-weight: 700; transition: filter .15s, transform .1s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(.98); }
  .composer-opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .field select, .field input[type="date"] {
    height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); font-size: 13px;
  }
  :root[data-theme="dark"] .field input[type="date"] { color-scheme: dark; }
  .hint { margin-left: auto; font-size: 12px; color: var(--ink-3); }

  /* Toolbar */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 28px 0 12px; flex-wrap: wrap; }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--line); }
  .seg button {
    border: 0; background: transparent; padding: 7px 14px; border-radius: 9px;
    font-size: 14px; font-weight: 600; color: var(--ink-2); transition: background .15s, color .15s;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(22,32,46,.12); }
  .seg .count { margin-left: 6px; font-weight: 500; color: var(--ink-3); }
  .link-btn { border: 0; background: none; color: var(--ink-2); font-size: 14px; font-weight: 600; padding: 6px 4px; }
  .link-btn:hover:not(:disabled) { color: var(--danger); }
  .link-btn:disabled { opacity: .4; cursor: default; }

  /* List */
  .list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .item {
    position: relative; display: flex; align-items: center; gap: 14px;
    padding: 14px 14px 14px 18px; border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .item:last-child { border-bottom: 0; }
  .item::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--prio, var(--line)); }
  .item[data-priority="high"] { --prio: var(--high); }
  .item[data-priority="med"]  { --prio: var(--med); }
  .item[data-priority="low"]  { --prio: var(--low); }
  .item.done::before { opacity: .35; }

  .check { position: relative; flex: none; width: 24px; height: 24px; }
  .check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .check .box {
    width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--ink-3);
    display: grid; place-items: center; background: transparent; transition: background .15s, border-color .15s;
    pointer-events: none;
  }
  .check .box svg { width: 14px; height: 14px; stroke: var(--accent-ink); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .check input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .check input:checked + .box svg { opacity: 1; transform: scale(1); }
  .check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

  .body { flex: 1; min-width: 0; }
  .title { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .item.done .title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); }
  .chip.overdue { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .chip.today { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

  .edit-input {
    width: 100%; height: 38px; padding: 0 10px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--surface); outline: none; font-weight: 600;
  }
  .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .item:hover .actions, .item:focus-within .actions { opacity: 1; }
  @media (hover: none) { .actions { opacity: 1; } }
  .act { width: 34px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-3); display: grid; place-items: center; }
  .act:hover { background: var(--surface-2); color: var(--ink); }
  .act.del:hover { color: var(--danger); }
  .act svg { width: 16px; height: 16px; }

  .item.enter { animation: pop .22s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* Empty */
  .empty { padding: 48px 24px; text-align: center; }
  .empty h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .empty p { margin: 0; color: var(--ink-2); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    display: flex; align-items: center; gap: 16px; padding: 12px 14px 12px 18px;
    background: var(--ink); color: var(--bg); border-radius: 12px; font-size: 14px; font-weight: 500;
    box-shadow: 0 12px 32px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 2px 4px; }

  @media (max-width: 520px) {
    .wrap { padding-top: 36px; }
    .composer-main { flex-direction: column; }
    .btn-primary { width: 100%; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="top">
    <div>
      <h1 class="date-day" id="dayName">Today</h1>
      <p class="date-full" id="dateFull"></p>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <section class="progress" aria-label="Progress">
    <div class="progress-row">
      <span><strong id="doneCount">0</strong> of <span id="totalCount">0</span> done</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><span id="barFill"></span></div>
  </section>

  <form class="card composer" id="form" autocomplete="off">
    <div class="composer-main">
      <input type="text" id="text" placeholder="What needs to get done?" maxlength="200" aria-label="New task" required>
      <button class="btn-primary" type="submit">Add task</button>
    </div>
    <div class="composer-opts">
      <label class="field">Priority
        <select id="priority">
          <option value="low">Low</option>
          <option value="med" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <label class="field">Due
        <input type="date" id="due">
      </label>
      <span class="hint">Double-click a task to edit it</span>
    </div>
  </form>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All<span class="count" id="cAll">0</span></button>
      <button type="button" data-filter="active" aria-pressed="false">Active<span class="count" id="cActive">0</span></button>
      <button type="button" data-filter="done" aria-pressed="false">Done<span class="count" id="cDone">0</span></button>
    </div>
    <button class="link-btn" id="clearBtn" type="button">Clear completed</button>
  </div>

  <section class="card" aria-live="polite">
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <h2 id="emptyTitle">No tasks yet</h2>
      <p id="emptyText">Type a task above and press Enter.</p>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status">
  <span id="toastMsg"></span>
  <button type="button" id="undoBtn">Undo</button>
</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "tasks.v1";
  const THEME_KEY = "tasks.theme";

  const $ = (id) => document.getElementById(id);
  const els = {
    list: $("list"), empty: $("empty"), emptyTitle: $("emptyTitle"), emptyText: $("emptyText"),
    form: $("form"), text: $("text"), priority: $("priority"), due: $("due"),
    doneCount: $("doneCount"), totalCount: $("totalCount"), pct: $("pct"), bar: $("bar"), barFill: $("barFill"),
    cAll: $("cAll"), cActive: $("cActive"), cDone: $("cDone"), clearBtn: $("clearBtn"),
    toast: $("toast"), toastMsg: $("toastMsg"), undoBtn: $("undoBtn"), themeBtn: $("themeBtn"),
  };

  const PRIORITY_LABEL = { high: "High", med: "Medium", low: "Low" };

  /* ---------- State ---------- */
  let tasks = load();
  let filter = "all";
  let editingId = null;
  let lastRemoved = null;
  let toastTimer = null;
  let justAddedId = null;

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(raw) ? raw : [];
    } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------- Dates ---------- */
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function formatDue(str) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function renderHeaderDate() {
    const now = new Date();
    $("dayName").textContent = now.toLocaleDateString(undefined, { weekday: "long" });
    $("dateFull").textContent = now.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  }

  /* ---------- Icons (static, trusted markup) ---------- */
  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    cal: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  };

  function el(tag, props = {}, html) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    if (html) node.innerHTML = html; // only used with the static ICON strings above
    return node;
  }

  /* ---------- Rendering ---------- */
  function visibleTasks() {
    if (filter === "active") return tasks.filter((t) => !t.done);
    if (filter === "done") return tasks.filter((t) => t.done);
    return tasks;
  }

  function render() {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const pct = total ? Math.round((done / total) * 100) : 0;

    els.doneCount.textContent = done;
    els.totalCount.textContent = total;
    els.pct.textContent = pct + "%";
    els.barFill.style.width = pct + "%";
    els.bar.setAttribute("aria-valuenow", pct);
    els.cAll.textContent = total;
    els.cActive.textContent = total - done;
    els.cDone.textContent = done;
    els.clearBtn.disabled = done === 0;

    document.querySelectorAll("[data-filter]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.filter === filter))
    );

    const shown = visibleTasks();
    els.list.replaceChildren();
    shown.forEach((t) => els.list.appendChild(renderItem(t)));

    const isEmpty = shown.length === 0;
    els.empty.hidden = !isEmpty;
    els.list.hidden = isEmpty;
    if (isEmpty) {
      if (total === 0) {
        els.emptyTitle.textContent = "No tasks yet";
        els.emptyText.textContent = "Type a task above and press Enter.";
      } else if (filter === "active") {
        els.emptyTitle.textContent = "Nothing left to do";
        els.emptyText.textContent = "Every task is complete.";
      } else {
        els.emptyTitle.textContent = "No completed tasks";
        els.emptyText.textContent = "Tasks you finish will show up here.";
      }
    }

    if (editingId) {
      const input = els.list.querySelector(".edit-input");
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }
    justAddedId = null;
  }

  function renderItem(t) {
    const li = el("li", { className: "item" + (t.done ? " done" : "") + (t.id === justAddedId ? " enter" : "") });
    li.dataset.id = t.id;
    li.dataset.priority = t.priority;

    const check = el("label", { className: "check" });
    const cb = el("input", { type: "checkbox", checked: t.done });
    cb.setAttribute("aria-label", "Mark complete: " + t.text);
    cb.addEventListener("change", () => toggle(t.id));
    check.append(cb, el("span", { className: "box" }, ICON.check));

    const body = el("div", { className: "body" });

    if (editingId === t.id) {
      const input = el("input", { className: "edit-input", type: "text", value: t.text, maxLength: 200 });
      input.setAttribute("aria-label", "Edit task");
      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        if (commit) {
          const v = input.value.trim();
          if (v) t.text = v;
          save();
        }
        editingId = null;
        render();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true);
        if (e.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
      body.appendChild(input);
    } else {
      const title = el("p", { className: "title" });
      title.textContent = t.text;
      title.addEventListener("dblclick", () => startEdit(t.id));
      body.appendChild(title);
    }

    const meta = el("div", { className: "meta" });
    const pr = el("span", { className: "chip" });
    pr.textContent = PRIORITY_LABEL[t.priority] + " priority";
    meta.appendChild(pr);
    if (t.due) {
      const chip = el("span", { className: "chip" }, ICON.cal);
      const label = document.createElement("span");
      const today = todayStr();
      if (!t.done && t.due < today) { chip.classList.add("overdue"); label.textContent = "Overdue · " + formatDue(t.due); }
      else if (t.due === today) { if (!t.done) chip.classList.add("today"); label.textContent = "Due today"; }
      else { label.textContent = "Due " + formatDue(t.due); }
      chip.appendChild(label);
      meta.appendChild(chip);
    }
    body.appendChild(meta);

    const actions = el("div", { className: "actions" });
    const editBtn = el("button", { className: "act", type: "button" }, ICON.edit);
    editBtn.setAttribute("aria-label", "Edit task");
    editBtn.addEventListener("click", () => startEdit(t.id));
    const delBtn = el("button", { className: "act del", type: "button" }, ICON.trash);
    delBtn.setAttribute("aria-label", "Delete task");
    delBtn.addEventListener("click", () => remove(t.id));
    actions.append(editBtn, delBtn);

    li.append(check, body, actions);
    return li;
  }

  /* ---------- Actions ---------- */
  function add(text, priority, due) {
    const t = { id: uid(), text, done: false, priority, due: due || "", created: Date.now() };
    tasks.unshift(t);
    justAddedId = t.id;
    save();
    render();
  }
  function toggle(id) {
    const t = tasks.find((x) => x.id === id);
    if (!t) return;
    t.done = !t.done;
    save();
    render();
  }
  function startEdit(id) { editingId = id; render(); }
  function remove(id) {
    const idx = tasks.findIndex((x) => x.id === id);
    if (idx < 0) return;
    const [t] = tasks.splice(idx, 1);
    lastRemoved = [{ task: t, index: idx }];
    save(); render();
    showToast("Task deleted");
  }
  function clearCompleted() {
    const removed = [];
    tasks.forEach((t, i) => { if (t.done) removed.push({ task: t, index: i }); });
    if (!removed.length) return;
    tasks = tasks.filter((t) => !t.done);
    lastRemoved = removed;
    save(); render();
    showToast(removed.length === 1 ? "1 completed task cleared" : removed.length + " completed tasks cleared");
  }
  function undo() {
    if (!lastRemoved) return;
    lastRemoved.sort((a, b) => a.index - b.index).forEach(({ task, index }) => tasks.splice(Math.min(index, tasks.length), 0, task));
    lastRemoved = null;
    save(); render(); hideToast();
  }

  /* ---------- Toast ---------- */
  function showToast(msg) {
    els.toastMsg.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { els.toast.classList.remove("show"); }

  /* ---------- Theme ---------- */
  function applyTheme(mode) {
    document.documentElement.dataset.theme = mode;
    els.themeBtn.setAttribute("aria-label", mode === "dark" ? "Switch to light theme" : "Switch to dark theme");
  }
  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch {}
    const prefersDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (prefersDark ? "dark" : "light"));
  }

  /* ---------- Events ---------- */
  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = els.text.value.trim();
    if (!v) return;
    add(v, els.priority.value, els.due.value);
    els.text.value = "";
    els.due.value = "";
    els.text.focus();
  });
  document.querySelectorAll("[data-filter]").forEach((b) =>
    b.addEventListener("click", () => { filter = b.dataset.filter; render(); })
  );
  els.clearBtn.addEventListener("click", clearCompleted);
  els.undoBtn.addEventListener("click", undo);
  els.themeBtn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
  });

  /* ---------- Init ---------- */
  initTheme();
  renderHeaderDate();
  render();
})();
</script>
</body>
</html>
